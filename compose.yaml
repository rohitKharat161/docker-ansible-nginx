
services:
  backend1:
    image: nginx:alpine
    container_name: backend1
    command: /bin/sh -c "echo 'Hello from Backend 1' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
    networks:
      - app-network

  backend2:
    image: nginx:alpine
    container_name: backend2
    command: /bin/sh -c "echo 'Hello from Backend 2' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
    networks:
      - app-network

  ansible-control:
    build:
      context: ./docker/control
    container_name: ansible-control
    tty: true
    stdin_open: true
    volumes:
      - ./ansible:/ansible
    networks:
      - app-network

  
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
