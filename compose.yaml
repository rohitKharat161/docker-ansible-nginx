
services:
  backend1:
    build:
      context: ./docker/backend
    container_name: backend1
    volumes:
      - ./ansible/ansible_key.pub:/tmp/ansible_key.pub:ro
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /home/ansible/.ssh
        cat /tmp/ansible_key.pub > /home/ansible/.ssh/authorized_keys
        chown -R ansible:ansible /home/ansible/.ssh
        chmod 700 /home/ansible/.ssh
        chmod 600 /home/ansible/.ssh/authorized_keys
        echo 'Hello from Backend 1' > /usr/share/nginx/html/index.html
        /usr/sbin/sshd
        exec nginx -g 'daemon off;'
    networks:
      - app-network

  backend2:
    build:
      context: ./docker/backend
    container_name: backend2
    volumes:
      - ./ansible/ansible_key.pub:/tmp/ansible_key.pub:ro
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /home/ansible/.ssh
        cat /tmp/ansible_key.pub > /home/ansible/.ssh/authorized_keys
        chown -R ansible:ansible /home/ansible/.ssh
        chmod 700 /home/ansible/.ssh
        chmod 600 /home/ansible/.ssh/authorized_keys
        echo 'Hello from Backend 2' > /usr/share/nginx/html/index.html
        /usr/sbin/sshd
        exec nginx -g 'daemon off;'
    networks:
      - app-network

  ansible-control:
    build:
      context: ./docker/control
    container_name: ansible-control
    tty: true
    stdin_open: true
    volumes:
      - ./ansible:/ansible
    networks:
      - app-network

  
  reverse-proxy:
    build:
      context: ./docker/proxy
    container_name: reverse-proxy
    cap_add:
      - NET_ADMIN
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
